services:
  openfga:
    image: openfga/openfga:v1.8.12
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "3000:3000"

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.12.4
    command: ["-config", "/run/spire/config/server.conf"]
    volumes:
      - ./spire/server.conf:/run/spire/config/server.conf:ro
      - spire-data:/run/spire/data
    ports:
      - "8081:8081"

volumes:
  spire-data:
